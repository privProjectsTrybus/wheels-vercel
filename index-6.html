// ─── CAR SVG PLACEHOLDER ────────────────────────────────────────
function CarSVG({ name, series, color = "#E8272A", size = 80 }) {
  const c = color || "#E8272A";
  return (
    <svg width={size} height={size * 0.6} viewBox="0 0 120 72" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id={`grad-${name?.slice(0,4)}`} x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stopColor={c} stopOpacity="0.9"/>
          <stop offset="100%" stopColor={c} stopOpacity="0.4"/>
        </linearGradient>
      </defs>
      <rect x="10" y="30" width="100" height="28" rx="4" fill={`url(#grad-${name?.slice(0,4)})`}/>
      <path d="M25 30 Q35 12 55 12 Q75 12 85 30 Z" fill={c} opacity="0.85"/>
      <circle cx="30" cy="58" r="9" fill="#1a1a1d" stroke="#3a3a3f" strokeWidth="2"/>
      <circle cx="30" cy="58" r="5" fill="#2a2a2d"/>
      <circle cx="90" cy="58" r="9" fill="#1a1a1d" stroke="#3a3a3f" strokeWidth="2"/>
      <circle cx="90" cy="58" r="5" fill="#2a2a2d"/>
      <rect x="50" y="16" width="20" height="12" rx="2" fill="#88CCFF" opacity="0.5"/>
    </svg>
  );
}

// ─── AUTH CONTEXT ────────────────────────────────────────────────
const AuthContext = createContext(null);
function useAuth() { return useContext(AuthContext); }

function AuthProvider({ children }) {
  const [user, setUser] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    try {
      const stored = localStorage.getItem("wheels_user");
      if (stored) setUser(JSON.parse(stored));
    } catch {}
    setLoading(false);
  }, []);

  const register = (email, password, name) => {
    try {
      const users = JSON.parse(localStorage.getItem("wheels_users") || "{}");
      if (users[email]) return { error: "Email already registered" };
      const newUser = { id: Date.now().toString(), email, name, createdAt: new Date().toISOString() };
      users[email] = { ...newUser, password };
      localStorage.setItem("wheels_users", JSON.stringify(users));
      localStorage.setItem(`wheels_collection_${newUser.id}`, JSON.stringify([]));
      setUser(newUser);
      localStorage.setItem("wheels_user", JSON.stringify(newUser));
      return { user: newUser };
    } catch { return { error: "Registration failed" }; }
  };

  const login = (email, password) => {
    try {
      const users = JSON.parse(localStorage.getItem("wheels_users") || "{}");
      const u = users[email];
      if (!u || u.password !== password) return { error: "Invalid email or password" };
      const { password: _, ...userSafe } = u;
      setUser(userSafe);
      localStorage.setItem("wheels_user", JSON.stringify(userSafe));
      return { user: userSafe };
    } catch { return { error: "Login failed" }; }
  };

  const logout = () => {
    setUser(null);
    localStorage.removeItem("wheels_user");
  };

  return <AuthContext.Provider value={{ user, login, register, logout, loading }}>{children}</AuthContext.Provider>;
}

// ─── COLLECTION CONTEXT ──────────────────────────────────────────
const CollectionContext = createContext(null);
function useCollection() { return useContext(CollectionContext); }

function CollectionProvider({ children }) {
  const { user } = useAuth();
  const [collection, setCollection] = useState([]);

  useEffect(() => {
    if (!user) { setCollection([]); return; }
    try {
      const stored = JSON.parse(localStorage.getItem(`wheels_collection_${user.id}`) || "[]");
      setCollection(stored);
    } catch { setCollection([]); }
  }, [user]);

  const save = (col) => {
    if (!user) return;
    setCollection(col);
    localStorage.setItem(`wheels_collection_${user.id}`, JSON.stringify(col));
  };

  const addCar = (car, condition = "Loose Mint", notes = "") => {
    const entry = { ...car, condition, notes, addedAt: new Date().toISOString(), entryId: Date.now().toString() };
    const newCol = [...collection, entry];
    save(newCol);
    return entry;
  };

  const removeCar = (entryId) => save(collection.filter(c => c.entryId !== entryId));
  const inCollection = (carId) => collection.some(c => c.id === carId);
  const totalValue = () => collection.reduce((sum, c) => {
    const v = c.condition === "Mint in Box" ? c.cardedValue : c.looseValue;
    return sum + ((v.min + v.max) / 2);
  }, 0);

  return <CollectionContext.Provider value={{ collection, addCar, removeCar, inCollection, totalValue }}>{children}</CollectionContext.Provider>;
}

// ─── RARITY BADGE ────────────────────────────────────────────────
function RarityBar({ rarity, showLabel = true }) {
  const label = rarity >= 9 ? "ULTRA RARE" : rarity >= 7 ? "RARE" : rarity >= 5 ? "UNCOMMON" : rarity >= 3 ? "COMMON" : "EASY FIND";
  const color = rarity >= 9 ? T.red : rarity >= 7 ? T.gold : rarity >= 5 ? "#8B5CF6" : rarity >= 3 ? "#3B82F6" : T.textMuted;
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      {showLabel && <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span style={{ fontSize: 10, color, fontFamily: T.fontDisplay, fontWeight: 700, letterSpacing: 1 }}>{label}</span>
        <span style={{ fontSize: 10, color: T.textMuted, fontFamily: T.fontDisplay }}>{rarity}/10</span>
      </div>}
      <div style={{ height: 4, background: T.border, borderRadius: 2, overflow: "hidden" }}>
        <div style={{ height: "100%", width: `${rarity * 10}%`, background: color, borderRadius: 2, transition: "width 0.5s ease" }}/>
      </div>
    </div>
  );
}

// ─── TREND ICON ──────────────────────────────────────────────────
function TrendIcon({ trend, size = 14 }) {
  if (trend === "up") return <span style={{ color: T.green, fontSize: size }}>▲</span>;
  if (trend === "down") return <span style={{ color: T.red, fontSize: size }}>▼</span>;
  return <span style={{ color: T.textMuted, fontSize: size }}>—</span>;
}

// ─── SCAN TAB ────────────────────────────────────────────────────
function ScanTab() {
  const { addCar } = useCollection();
  const [scanState, setScanState] = useState("idle"); // idle, loading, result, error
  const [result, setResult] = useState(null);
  const [preview, setPreview] = useState(null);
  const [showDetail, setShowDetail] = useState(false);
  const fileRef = useRef(null);

  const identifyCar = async (base64, mimeType) => {
    setScanState("loading");
    try {
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          messages: [{
            role: "user",
            content: [
              { type: "image", source: { type: "base64", media_type: mimeType, data: base64 } },
              { type: "text", text: `You are a Hot Wheels expert with encyclopedic knowledge of all Hot Wheels castings from 1968 to present. Analyze this image carefully and identify the Hot Wheels car. Look for: the casting shape, any visible text/branding, paint color, wheel type, any treasure hunt markings. Return ONLY valid JSON with no markdown: { "identified": boolean, "name": string, "series": string, "year": number, "casting": string, "color": string, "confidence": number, "isTreasureHunt": boolean, "isSuperTH": boolean, "estimatedLooseValue": number, "estimatedCardedValue": number, "rarity": number, "notes": string }` }
            ]
          }]
        })
      });
      const data = await response.json();
      const text = data.content?.map(b => b.text || "").join("") || "";
      const cleaned = text.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(cleaned);

      // Try to match against database
      const dbMatch = HW_DB.find(car =>
        car.name.toLowerCase().includes(parsed.name?.toLowerCase()?.split(" ")[0] || "!!!") ||
        parsed.name?.toLowerCase()?.includes(car.name.toLowerCase().split(" ")[0])
      );

      setResult({ ...parsed, dbMatch });
      setScanState("result");
    } catch (e) {
      console.error(e);
      setScanState("error");
    }
  };

  const handleFile = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      setPreview(dataUrl);
      const base64 = dataUrl.split(",")[1];
      const mimeType = file.type || "image/jpeg";
      identifyCar(base64, mimeType);
    };
    reader.readAsDataURL(file);
  };

  const reset = () => { setScanState("idle"); setResult(null); setPreview(null); };

  const spinnerStyle = { width: 48, height: 48, border: `3px solid ${T.border}`, borderTop: `3px solid ${T.red}`, borderRadius: "50%", animation: "spin 0.8s linear infinite" };

  return (
    <div style={{ padding: "24px 20px 80px", maxWidth: 480, margin: "0 auto" }}>
      <h2 style={{ fontFamily: T.fontDisplay, fontSize: 28, fontWeight: 900, color: T.text, letterSpacing: 2, marginBottom: 6 }}>SCAN & IDENTIFY</h2>
      <p style={{ color: T.textMuted, fontSize: 13, marginBottom: 24 }}>Take or upload a photo of any Hot Wheels car to identify it and get collector info.</p>

      {scanState === "idle" && (
        <div>
          {/* Scan zone */}
          <div
            onClick={() => fileRef.current?.click()}
            style={{ border: `2px dashed ${T.borderBright}`, borderRadius: 8, padding: "48px 24px", textAlign: "center", cursor: "pointer", background: T.surface, position: "relative", overflow: "hidden" }}
          >
            <div style={{ fontSize: 48, marginBottom: 12 }}>📷</div>
            <div style={{ fontFamily: T.fontDisplay, fontSize: 20, fontWeight: 800, color: T.text, marginBottom: 6, letterSpacing: 1 }}>TAP TO SCAN</div>
            <div style={{ color: T.textMuted, fontSize: 13 }}>Take a photo or upload from gallery</div>
            <div style={{ marginTop: 12, display: "flex", gap: 8, justifyContent: "center" }}>
              {["JPEG","PNG","HEIC"].map(f => (
                <span key={f} style={{ background: T.surfaceHigh, border: `1px solid ${T.border}`, borderRadius: 2, padding: "3px 8px", fontSize: 10, color: T.textMuted, fontFamily: T.fontDisplay, letterSpacing: 1 }}>{f}</span>
              ))}
            </div>
            <style>{`@keyframes scanpulse { 0%,100%{opacity:0.3} 50%{opacity:1} } @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }`}</style>
          </div>

          <input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={e => handleFile(e.target.files[0])} style={{ display: "none" }} />

          {/* Upload button (no camera) */}
          <input id="upload-no-capture" type="file" accept="image/*" onChange={e => handleFile(e.target.files[0])} style={{ display: "none" }} />
          <button onClick={() => document.getElementById("upload-no-capture").click()} style={{ width: "100%", background: T.surface, border: `1px solid ${T.border}`, borderRadius: 4, color: T.textMuted, padding: "12px 0", cursor: "pointer", fontFamily: T.fontDisplay, fontSize: 14, fontWeight: 700, letterSpacing: 1, marginTop: 12 }}>📂 UPLOAD FROM FILES</button>
        </div>
      )}

      {scanState === "loading" && (
        <div style={{ textAlign: "center", paddingTop: 40 }}>
          {preview && <img src={preview} style={{ width: "100%", maxHeight: 200, objectFit: "cover", borderRadius: 4, marginBottom: 24, opacity: 0.5 }} alt="scanning" />}
          <div style={{ display: "flex", justifyContent: "center", marginBottom: 16 }}><div style={spinnerStyle}/></div>
          <div style={{ fontFamily: T.fontDisplay, fontSize: 18, fontWeight: 800, color: T.text, letterSpacing: 2, marginBottom: 6 }}>IDENTIFYING...</div>
          <div style={{ color: T.textMuted, fontSize: 13 }}>AI is analyzing your Hot Wheels car</div>
        </div>
      )}

      {scanState === "error" && (
        <div style={{ textAlign: "center", paddingTop: 40 }}>
          <div style={{ fontSize: 48, marginBottom: 16 }}>⚠️</div>
          <div style={{ fontFamily: T.fontDisplay, fontSize: 20, fontWeight: 800, color: T.red, marginBottom: 8 }}>SCAN FAILED</div>
          <div style={{ color: T.textMuted, fontSize: 13, marginBottom: 20 }}>Could not identify the car. Try a clearer photo with good lighting.</div>
          <button onClick={reset} style={{ background: T.red, border: "none", borderRadius: 4, color: "#fff", padding: "12px 24px", cursor: "pointer", fontFamily: T.fontDisplay, fontSize: 15, fontWeight: 700, letterSpacing: 1 }}>TRY AGAIN</button>
        </div>
      )}

      {scanState === "result" && result && (
        <div>
          {preview && <img src={preview} style={{ width: "100%", maxHeight: 220, objectFit: "cover", borderRadius: 4, marginBottom: 16 }} alt="scanned" />}

          {/* Identified badge */}
          <div style={{ background: result.identified ? `${T.green}22` : `${T.red}22`, border: `1px solid ${result.identified ? T.green : T.red}44`, borderRadius: 4, padding: "12px 14px", marginBottom: 16, display: "flex", alignItems: "center", gap: 10 }}>
            <span style={{ fontSize: 20 }}>{result.identified ? "✅" : "⚠️"}</span>
            <div>
              <div style={{ fontFamily: T.fontDisplay, fontSize: 16, fontWeight: 800, color: result.identified ? T.green : T.red, letterSpacing: 0.5 }}>
                {result.identified ? "CAR IDENTIFIED" : "LOW CONFIDENCE MATCH"}
              </div>
              <div style={{ fontSize: 12, color: T.textMuted, marginTop: 2 }}>{result.notes}</div>
            </div>
          </div>

          {/* Car name */}
          <div style={{ marginBottom: 16 }}>
            <h3 style={{ fontFamily: T.fontDisplay, fontSize: 28, fontWeight: 900, color: T.text, marginBottom: 4, letterSpacing: 1 }}>{result.name || "Unknown Car"}</h3>
            <div style={{ color: T.textMuted, fontSize: 13 }}>{result.series} · {result.year} · {result.color}</div>
          </div>

          {/* Confidence */}
          <div style={{ marginBottom: 16 }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
              <span style={{ fontSize: 11, color: T.textMuted, fontFamily: T.fontDisplay, letterSpacing: 1 }}>CONFIDENCE</span>
              <span style={{ fontSize: 11, color: result.confidence >= 70 ? T.green : result.confidence >= 50 ? T.gold : T.red, fontFamily: T.fontDisplay, fontWeight: 700 }}>{result.confidence}%</span>
            </div>
            <div style={{ height: 6, background: T.border, borderRadius: 3 }}>
              <div style={{ height: "100%", width: `${result.confidence}%`, background: result.confidence >= 70 ? T.green : result.confidence >= 50 ? T.gold : T.red, borderRadius: 3, transition: "width 0.6s ease" }}/>
            </div>
          </div>

          {/* Value */}
          <div style={{ background: T.surface, border: `1px solid ${T.gold}33`, borderRadius: 4, padding: "12px 14px", marginBottom: 16 }}>
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <div>
                <div style={{ fontSize: 10, color: T.textDim, fontFamily: T.fontDisplay, letterSpacing: 1 }}>LOOSE EST. VALUE</div>
                <div style={{ fontSize: 20, fontFamily: T.fontDisplay, fontWeight: 800, color: T.gold }}>${result.estimatedLooseValue || "N/A"}</div>
              </div>
              <div style={{ textAlign: "right" }}>
                <div style={{ fontSize: 10, color: T.textDim, fontFamily: T.fontDisplay, letterSpacing: 1 }}>CARDED EST. VALUE</div>
                <div style={{ fontSize: 20, fontFamily: T.fontDisplay, fontWeight: 800, color: T.gold }}>${result.estimatedCardedValue || "N/A"}</div>
              </div>
            </div>
          </div>

          {/* Actions */}
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            {result.dbMatch ? (
              <button onClick={() => { addCar(result.dbMatch, "Loose Mint", ""); reset(); }} style={{ background: T.red, border: "none", borderRadius: 4, color: "#fff", padding: "14px 0", cursor: "pointer", fontFamily: T.fontDisplay, fontSize: 16, fontWeight: 800, letterSpacing: 2 }}>+ ADD TO COLLECTION</button>
            ) : (
              <button onClick={() => {}} style={{ background: T.red, border: "none", borderRadius: 4, color: "#fff", padding: "14px 0", cursor: "pointer", fontFamily: T.fontDisplay, fontSize: 16, fontWeight: 800, letterSpacing: 2 }}>+ ADD MANUALLY</button>
            )}
            <button onClick={reset} style={{ background: "transparent", border: `1px solid ${T.border}`, borderRadius: 4, color: T.textMuted, padding: "12px 0", cursor: "pointer", fontFamily: T.fontDisplay, fontSize: 14, fontWeight: 700, letterSpacing: 1 }}>SCAN ANOTHER</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── SEARCH TAB ──────────────────────────────────────────────────
function SearchTab() {
  const { inCollection, addCar } = useCollection();
  const [query, setQuery] = useState("");
  const [selectedCar, setSelectedCar] = useState(null);
  const [activeCat, setActiveCat] = useState("all");
  const [sortBy, setSortBy] = useState("name");
  const [recentSearches, setRecentSearches] = useState([]);

  const cats = ["all", ...new Set(HW_DB.map(c => c.cat))];

  const results = HW_DB.filter(car => {
    const q = query.toLowerCase();
    const matchQ = !q || car.name.toLowerCase().includes(q) || car.series.toLowerCase().includes(q) || car.casting.toLowerCase().includes(q) || String(car.year).includes(q);
    const matchCat = activeCat === "all" || car.cat === activeCat;
    return matchQ && matchCat;
  }).sort((a, b) => {
    if (sortBy === "value") return ((b.looseValue.min + b.looseValue.max) / 2) - ((a.looseValue.min + a.looseValue.max) / 2);
    if (sortBy === "rarity") return b.rarity - a.rarity;
    if (sortBy === "year") return b.year - a.year;
    return a.name.localeCompare(b.name);
  });

  const handleSearch = (q) => {
    setQuery(q);
    if (q.length > 2 && !recentSearches.includes(q)) {
      setRecentSearches(prev => [q, ...prev].slice(0, 6));
    }
  };

  const handleSelect = (car) => {
    setSelectedCar(car);
    if (query) handleSearch(query);
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", height: "calc(100vh - 56px)" }}>
      {/* Search bar */}
      <div style={{ padding: "16px 16px 0", background: T.bg }}>
        <div style={{ position: "relative" }}>
          <span style={{ position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)", color: T.textMuted, fontSize: 16 }}>🔍</span>
          <input
            value={query}
            onChange={e => handleSearch(e.target.value)}
            placeholder="Search 200+ Hot Wheels cars..."
            style={{ width: "100%", background: T.surface, border: `1px solid ${T.border}`, borderRadius: 4, color: T.text, padding: "12px 12px 12px 38px", fontSize: 15, fontFamily: T.fontBody, outline: "none" }}
          />
          {query && <button onClick={() => setQuery("")} style={{ position: "absolute", right: 10, top: "50%", transform: "translateY(-50%)", background: "none", border: "none", color: T.textMuted, cursor: "pointer", fontSize: 18 }}>✕</button>}
        </div>
      </div>

      {/* Filters row */}
      <div style={{ padding: "10px 12px", display: "flex", gap: 8, overflowX: "auto", borderBottom: `1px solid ${T.border}`, flexShrink: 0 }}>
        <select value={sortBy} onChange={e => setSortBy(e.target.value)} style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 4, color: T.text, padding: "6px 8px", fontSize: 11, fontFamily: T.fontDisplay, letterSpacing: 0.5, outline: "none", flexShrink: 0 }}>
          <option value="name">A→Z</option>
          <option value="value">VALUE ↓</option>
          <option value="rarity">RARITY ↓</option>
          <option value="year">YEAR ↓</option>
        </select>
        {cats.map(c => (
          <button key={c} onClick={() => setActiveCat(c)} style={{ background: activeCat === c ? T.red : T.surface, border: `1px solid ${activeCat === c ? T.red : T.border}`, borderRadius: 2, color: activeCat === c ? "#fff" : T.textMuted, cursor: "pointer", padding: "5px 10px", fontSize: 10, fontFamily: T.fontDisplay, fontWeight: 700, letterSpacing: 0.5, whiteSpace: "nowrap" }}>
            {c === "all" ? "ALL" : c.toUpperCase()}
          </button>
        ))}
      </div>

      {/* Recent searches */}
      {!query && recentSearches.length > 0 && (
        <div style={{ padding: "10px 16px", borderBottom: `1px solid ${T.border}` }}>
          <div style={{ fontSize: 10, color: T.textDim, fontFamily: T.fontDisplay, letterSpacing: 1, marginBottom: 6 }}>RECENT</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {recentSearches.map(s => (
              <button key={s} onClick={() => setQuery(s)} style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 2, color: T.textMuted, cursor: "pointer", padding: "4px 10px", fontSize: 12, fontFamily: T.fontBody }}>🕐 {s}</button>
            ))}
          </div>
        </div>
      )}

      {/* Results count */}
      <div style={{ padding: "8px 16px", fontSize: 11, color: T.textDim, fontFamily: T.fontDisplay, letterSpacing: 1, flexShrink: 0 }}>
        {results.length} CARS {query ? `MATCHING "${query.toUpperCase()}"` : ""}
      </div>

      {/* Results */}
      <div style={{ overflowY: "auto", flex: 1, padding: "0 16px 16px" }}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(160px, 1fr))", gap: 12 }}>
          {results.map(car => (
            <CarCard key={car.id} car={car} onClick={() => handleSelect(car)} inCol={inCollection(car.id)} onQuickAdd={() => { addCar(car, "Loose Mint", ""); }} />
          ))}
        </div>
      </div>

      {selectedCar && <DetailPanel car={selectedCar} onClose={() => setSelectedCar(null)} />}
    </div>
  );
}

// ─── PROFILE TAB ─────────────────────────────────────────────────
function ProfileTab() {
  const { user, logout } = useAuth();
  const { collection, totalValue } = useCollection();

  const byCategory = collection.reduce((acc, car) => {
    acc[car.cat] = (acc[car.cat] || 0) + 1;
    return acc;
  }, {});

  const topCats = Object.entries(byCategory).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const sthCount = collection.filter(c => c.isSTH).length;
  const thCount = collection.filter(c => c.isTH && !c.isSTH).length;
  const redlineCount = collection.filter(c => c.isRedline).length;
  const avgRarity = collection.length ? (collection.reduce((s, c) => s + c.rarity, 0) / collection.length).toFixed(1) : 0;

  return (
    <div style={{ padding: "24px 20px 80px", maxWidth: 520, margin: "0 auto" }}>
      {/* User card */}
      <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 4, padding: 20, marginBottom: 20, display: "flex", alignItems: "center", gap: 16 }}>
        <div style={{ width: 52, height: 52, borderRadius: "50%", background: T.red, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: T.fontDisplay, fontSize: 22, fontWeight: 900, color: "#fff", flexShrink: 0 }}>
          {(user?.name || user?.email || "?")[0].toUpperCase()}
        </div>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontFamily: T.fontDisplay, fontSize: 20, fontWeight: 800, color: T.text, letterSpacing: 0.5 }}>{user?.name || "Collector"}</div>
          <div style={{ color: T.textMuted, fontSize: 12, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{user?.email}</div>
          <div style={{ color: T.textDim, fontSize: 11, marginTop: 2 }}>Member since {new Date(user?.createdAt || Date.now()).toLocaleDateString("en-GB", { month: "long", year: "numeric" })}</div>
        </div>
      </div>

      {/* Stats */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 20 }}>
        {[
          ["🏎️", "TOTAL CARS", collection.length, T.text],
          ["💰", "COLLECTION VALUE", `$${totalValue().toFixed(0)}`, T.gold],
          ["⚡", "SUPER TH", sthCount, T.gold],
          ["🔥", "TREASURE HUNTS", thCount, T.red],
          ["🏆", "REDLINES", redlineCount, "#C9A84C"],
          ["⭐", "AVG RARITY", `${avgRarity}/10`, T.text],
        ].map(([icon, label, val, color]) => (
          <div key={label} style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 4, padding: "14px 16px" }}>
            <div style={{ fontSize: 18, marginBottom: 4 }}>{icon}</div>
            <div style={{ fontSize: 10, color: T.textDim, fontFamily: T.fontDisplay, letterSpacing: 1, marginBottom: 2 }}>{label}</div>
            <div style={{ fontSize: 22, fontFamily: T.fontDisplay, fontWeight: 800, color }}>{val}</div>
          </div>
        ))}
      </div>

      {/* Top categories */}
      {topCats.length > 0 && (
        <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 4, padding: "16px", marginBottom: 20 }}>
          <div style={{ fontSize: 11, color: T.textDim, fontFamily: T.fontDisplay, letterSpacing: 1, marginBottom: 12 }}>TOP CATEGORIES</div>
          {topCats.map(([cat, count]) => (
            <div key={cat} style={{ marginBottom: 10 }}>
              <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                <span style={{ fontSize: 13, color: T.text, fontFamily: T.fontBody }}>{cat}</span>
                <span style={{ fontSize: 13, color: T.textMuted, fontFamily: T.fontDisplay }}>{count}</span>
              </div>
              <div style={{ height: 3, background: T.border, borderRadius: 2 }}>
                <div style={{ height: "100%", width: `${(count / collection.length) * 100}%`, background: T.red, borderRadius: 2 }}/>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Sign out */}
      <button onClick={logout} style={{ width: "100%", background: "transparent", border: `1px solid ${T.border}`, borderRadius: 4, color: T.textMuted, padding: "13px 0", cursor: "pointer", fontFamily: T.fontDisplay, fontSize: 15, fontWeight: 700, letterSpacing: 1 }}>SIGN OUT</button>
    </div>
  );
}

// ─── BOTTOM NAV ──────────────────────────────────────────────────
function BottomNav({ active, setActive }) {
  const tabs = [
    { id: "collection", icon: "🏠", label: "GARAGE" },
    { id: "scan", icon: "📷", label: "SCAN" },
    { id: "search", icon: "🔍", label: "SEARCH" },
    { id: "profile", icon: "👤", label: "PROFILE" },
  ];
  return (
    <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: T.surface, borderTop: `1px solid ${T.border}`, display: "flex", zIndex: 100, maxWidth: 640, margin: "0 auto" }}>
      {tabs.map(t => (
        <button key={t.id} onClick={() => setActive(t.id)} style={{ flex: 1, background: "none", border: "none", padding: "10px 0 14px", cursor: "pointer", display: "flex", flexDirection: "column", alignItems: "center", gap: 3 }}>
          <span style={{ fontSize: 20 }}>{t.icon}</span>
          <span style={{ fontSize: 9, fontFamily: T.fontDisplay, fontWeight: 700, letterSpacing: 1, color: active === t.id ? T.red : T.textDim }}>{t.label}</span>
          {active === t.id && <div style={{ position: "absolute", bottom: 0, width: 32, height: 2, background: T.red, borderRadius: "2px 2px 0 0" }}/>}
        </button>
      ))}
    </div>
  );
}

// ─── MAIN APP ────────────────────────────────────────────────────
function AppInner() {
  const { user, loading } = useAuth();
  const [tab, setTab] = useState("collection");

  if (loading) return (
    <div style={{ minHeight: "100vh", background: T.bg, display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div style={{ fontFamily: T.fontDisplay, fontSize: 48, fontWeight: 900, color: T.text, letterSpacing: 6 }}><span style={{ color: T.red }}>W</span>HEELS</div>
    </div>
  );

  if (!user) return <AuthScreen />;

  return (
    <div style={{ background: T.bg, minHeight: "100vh", maxWidth: 640, margin: "0 auto", position: "relative" }}>
      {/* Top bar */}
      <div style={{ position: "sticky", top: 0, background: T.bg, borderBottom: `1px solid ${T.border}`, padding: "14px 20px", display: "flex", justifyContent: "space-between", alignItems: "center", zIndex: 50 }}>
        <div style={{ fontFamily: T.fontDisplay, fontSize: 28, fontWeight: 900, color: T.text, letterSpacing: 4, lineHeight: 1 }}>
          <span style={{ color: T.red }}>W</span>HEELS
        </div>
        <div style={{ fontSize: 11, color: T.textDim, fontFamily: T.fontDisplay, letterSpacing: 2 }}>
          {tab === "collection" ? "MY GARAGE" : tab === "scan" ? "AI SCANNER" : tab === "search" ? "DATABASE" : "PROFILE"}
        </div>
      </div>

      {/* Content */}
      <div style={{ paddingBottom: 80 }}>
        {tab === "collection" && <CollectionTab />}
        {tab === "scan" && <ScanTab />}
        {tab === "search" && <SearchTab />}
        {tab === "profile" && <ProfileTab />}
      </div>

      <BottomNav active={tab} setActive={setTab} />
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap');
        * { box-sizing: border-box; }
        body { margin: 0; background: #0A0A0B; }
        @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
        input::placeholder { color: #4A4A4D; }
        textarea::placeholder { color: #4A4A4D; }
        select option { background: #141416; color: #F0EDE8; }
      `}</style>
    </div>
  );
}

function App() {
  return (
    <AuthProvider>
      <CollectionProvider>
        <AppInner />
      </CollectionProvider>
    </AuthProvider>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
</body>
</html>
